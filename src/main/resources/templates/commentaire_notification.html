<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Nouveau commentaire sur votre réclamation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f7f9fc; margin:0; padding: 20px; color: #333;">
<div style="max-width: 600px; margin: auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 30px;">
    <h2 style="color: #2c3e50; margin-top: 0;"> <p th:text="'Bonjour ' + ${username} + ','"></p></h2>
    <p style="font-size: 16px; line-height: 1.5;">
        Un nouveau commentaire est ajouté sur votre réclamation.
    </p>
    <p style="font-size: 16px; line-height: 1.5;">
        Vous pouvez consulter la discussion en cliquant sur le lien suivant :<br>
        <a th:href="${confirmationUrl}" style="display: inline-block; margin-top: 10px; padding: 10px 15px; background-color: #3498db; color: white; text-decoration: none; border-radius: 4px;">
            Voir la réclamation
        </a>
    </p>


    <p style="margin-top: 30px; font-size: 14px; color: #777;">
        Cordialement,<br>
        L'équipe support Orange
    </p>
</div>
</body>
</html>
