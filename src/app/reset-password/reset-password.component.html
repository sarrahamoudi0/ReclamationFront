<div class="container">
  <h1>Reset Password</h1>

  <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">

    <!-- New Password Field -->
    <div class="form-group">
      <label for="newPassword">New Password:</label>
      <input
        id="newPassword"
        type="password"
        formControlName="newPassword"
        class="form-control"
        placeholder="Enter new password"
      />
      <div
        *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched"
        class="error-messages"
      >
        <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">
          New password is required
        </small>
        <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">
          Password must be at least 6 characters long
        </small>
      </div>
    </div>

    <!-- Confirm Password Field -->
    <div class="form-group">
      <label for="confirmPassword">Confirm Password:</label>
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        class="form-control"
        placeholder="Confirm your password"
      />
      <div
        *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched"
        class="error-messages"
      >
        <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">
          Please confirm your password
        </small>
        <small *ngIf="resetPasswordForm.hasError('passwordMismatch') && resetPasswordForm.get('confirmPassword')?.touched">
          Passwords must match
        </small>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="resetPasswordForm.invalid" class="btn btn-primary">
      Reset Password
    </button>
  </form>

  <!-- Success / Error Message -->
  <p *ngIf="message" class="message">{{ message }}</p>
</div>
