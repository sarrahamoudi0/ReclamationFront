<div class="container">
    <h1>Reset Password</h1>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      <div>
        <label for="newPassword">New Password:</label>
        <input id="newPassword" formControlName="newPassword" type="password" />
        <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
          <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">New password is required</small>
          <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters long</small>
        </div>
      </div>
      
      <div>
        <label for="confirmPassword">Confirm Password:</label>
        <input id="confirmPassword" formControlName="confirmPassword" type="password" />
        <div *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched">
          <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">Please confirm your password</small>
          <small *ngIf="resetPasswordForm.hasError('passwordMismatch') && resetPasswordForm.get('confirmPassword')?.touched">Passwords must match</small>
        </div>
      </div>
  
      <button type="submit" [disabled]="resetPasswordForm.invalid">Reset Password</button>
    </form>
    
    <p *ngIf="message">{{ message }}</p>
  </div>
