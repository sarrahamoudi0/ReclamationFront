<div class="forgot-password-container">
  <div class="forgot-password-card">
    <h2 class="forgot-password-title">Réinitialiser le mot de passe</h2>
    
    <!-- Status Message for Success or Error -->
    <div *ngIf="submissionStatus" [ngClass]="{
      'status-message': true, 
      'success': submissionStatus.success, 
      'error': !submissionStatus.success
    }">
      {{ submissionStatus.message }}
    </div>

    <!-- Forgot Password Form -->
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" class="form-control" placeholder="Entrez votre email" />
        
        <!-- Error message if email validation fails -->
        <div *ngIf="email?.hasError('required') && email?.touched" class="error-message">
          L'email est requis.
        </div>
        <div *ngIf="email?.hasError('email') && email?.touched" class="error-message">
          Veuillez entrer un email valide.
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="isSubmitting">Envoyer</button>

      <!-- Loading indicator (while submitting) -->
      <div *ngIf="isSubmitting" class="status-message">Envoi en cours...</div>
    </form>
  </div>
</div>
