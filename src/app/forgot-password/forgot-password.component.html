<!-- Forgot Password Form Layout -->
<form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" id="ForgotPassword">
  <!-- Left section (unchanged) -->
  <div class="left">
      <div>
        <p>Réinitialiser le mot de passe</p>
        <a>Vous avez déjà un compte ?</a>
        <input routerLink="/login" type="submit" value="Se connecter" />
      </div>
    </div>

  <!-- Right section (email input for password reset only) -->
  <div class="right">
    <div>
      <h1>Réinitialiser le mot de passe</h1>

      <!-- Status Message -->
      <div *ngIf="submissionStatus" [ngClass]="{
        'status-message': true, 
        'success': submissionStatus.success, 
        'error': !submissionStatus.success
      }">
        {{ submissionStatus.message }}
      </div>

      <br>
      <br>
      <br>
      <!-- Email input field -->
      
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="Entrez votre email"
        class="form-control"
      />

      <!-- Email validation errors -->
      <div *ngIf="email?.hasError('required') && email?.touched" class="error-message">
        L'email est requis.
      </div>
      <div *ngIf="email?.hasError('email') && email?.touched" class="error-message">
        Veuillez entrer un email valide.
      </div>
<br>
<br>
      <!-- Submit button -->
      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm"></span>
        Envoyer
      </button>
    </div>
  </div>
</form>
