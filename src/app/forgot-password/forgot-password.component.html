<div class="forgot-password-container">
    <div class="forgot-password-card">
      <h2 class="forgot-password-title">Réinitialisation du mot de passe</h2>
  
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <!-- Email Input Field -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Entrez votre email"
            class="form-control"
          />
  
          <!-- Error Message for Invalid Email -->
          <div
            *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
            class="error-message"
          >
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">L'email est requis</small>
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Veuillez entrer un email valide</small>
          </div>
        </div>
  
        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="forgotPasswordForm.invalid"
          class="submit-btn"
        >
          Envoyer un email de réinitialisation
        </button>
      </form>
  
      <!-- Success/Failure Message -->
      <div *ngIf="submissionStatus" class="status-message" [ngClass]="{'success': submissionStatus.success, 'error': !submissionStatus.success}">
        {{ submissionStatus.message }}
      </div>
    </div>
  </div>
