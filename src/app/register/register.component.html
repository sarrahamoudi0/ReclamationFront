<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg p-4 rounded-lg">
          <h2 class="text-center text-primary mb-4">Créer un compte</h2>
  
          <!-- Affichage du message d'erreur si l'email existe déjà -->
          <div *ngIf="errorMessage" class="alert alert-danger mt-2">
            {{ errorMessage }}
          </div>
  
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <!-- Prénom -->
            <div class="form-group">
              <label for="firstname">Prénom</label>
              <input
                id="firstname"
                formControlName="firstname"
                type="text"
                class="form-control form-control-lg"
                [ngClass]="{ 'is-invalid': f['firstname'].touched && f['firstname'].invalid }"
                placeholder="Jean"
              />
              <div *ngIf="f['firstname'].touched && f['firstname'].invalid" class="invalid-feedback">
                Le prénom est requis.
              </div>
            </div>
  
            <!-- Nom -->
            <div class="form-group">
              <label for="lastname">Nom</label>
              <input
                id="lastname"
                formControlName="lastname"
                type="text"
                class="form-control form-control-lg"
                [ngClass]="{ 'is-invalid': f['lastname'].touched && f['lastname'].invalid }"
                placeholder="Dupont"
              />
              <div *ngIf="f['lastname'].touched && f['lastname'].invalid" class="invalid-feedback">
                Le nom est requis.
              </div>
            </div>
  
            <!-- Email -->
            <div class="form-group">
              <label for="email">Email</label>
              <input
                id="email"
                formControlName="email"
                type="email"
                class="form-control form-control-lg"
                [ngClass]="{ 'is-invalid': f['email'].touched && f['email'].invalid }"
                placeholder="vous@exemple.com"
              />
              <div *ngIf="f['email'].touched && f['email'].invalid" class="invalid-feedback">
                <div *ngIf="f['email'].errors?.['required']">L'email est requis.</div>
                <div *ngIf="f['email'].errors?.['email']">Format d'email invalide.</div>
              </div>
            </div>
  
            <!-- Mot de passe -->
            <div class="form-group">
              <label for="password">Mot de passe</label>
              <input
                id="password"
                formControlName="password"
                type="password"
                class="form-control form-control-lg"
                [ngClass]="{ 'is-invalid': f['password'].touched && f['password'].invalid }"
                placeholder="********"
              />
              <div *ngIf="f['password'].touched && f['password'].invalid" class="invalid-feedback">
                <div *ngIf="f['password'].errors?.['required']">Le mot de passe est requis.</div>
                <div *ngIf="f['password'].errors?.['minlength']">Le mot de passe doit contenir au moins 8 caractères.</div>
              </div>
            </div>
  
            <!-- Téléphone -->
            <div class="form-group">
              <label for="phone">Téléphone</label>
              <input
                id="phone"
                formControlName="phone"
                type="text"
                class="form-control form-control-lg"
                [ngClass]="{ 'is-invalid': f['phone'].touched && f['phone'].invalid }"
                placeholder="(01) 23 45 67 89"
              />
              <div *ngIf="f['phone'].touched && f['phone'].invalid" class="invalid-feedback">
                Le numéro de téléphone est requis.
              </div>
            </div>
  
            <!-- Bouton d'enregistrement -->
            <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="registerForm.invalid">
              S'inscrire
            </button>
          </form>
  
          <!-- Lien pour ceux qui ont déjà un compte -->
          <div class="text-center mt-3">
            <p>Vous avez déjà un compte ?</p>
            <a routerLink="/login" class="btn btn-outline-secondary btn-sm">Se connecter</a>
          </div>
        </div>
      </div>
    </div>
  </div>
