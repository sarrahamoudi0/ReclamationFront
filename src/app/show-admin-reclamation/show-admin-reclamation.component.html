<!-- show-admin-reclamation.component.html -->

<!-- Card Container -->
<div class="container" *ngIf="reclamation">
  <div class="reclamation-card">

    <!-- Statut -->
    <div class="statut-container">
      <!-- Badge that acts as a toggle button -->
      <span
        [ngClass]="getStatutClass(reclamation.statut)"
        class="statut-badge"
        (click)="toggleStatutList()">
        {{ reclamation.statut }}
      </span>

      <!-- Statut Dropdown -->
      <div *ngIf="showStatutList" class="statut-dropdown">
        <ul class="statut-list">
          <li
            *ngFor="let statut of statutValues"
            (click)="selectStatut(statut)"
            [class.active]="statut === reclamation.statut">
            {{ statut }}
          </li>
        </ul>
      </div>
    </div>

    <!-- Infos -->
    <div class="reclamation-info">
      <h3 class="reclamation-title">{{ reclamation.titre }}</h3>
      <p class="reclamation-description">{{ reclamation.description }}</p>
    </div>

    <!-- Image -->
    <div
      *ngIf="reclamation.image_reclamation"
      class="reclamation-image"
      [ngClass]="{'zoomed': isImageZoomed}"
      (click)="zoomImage()">
      <img
        [src]="'data:image/jpeg;base64,' + reclamation.image_reclamation"
        alt="Image de la réclamation" />
    </div>

    <!-- Footer -->
    <div class="reclamation-footer">
      <span class="created-date">
        🕒 {{ reclamation.createdDate | date:'mediumDate' }}
      </span>
    </div>

  </div>
</div>

<!-- Loading Message -->
<div *ngIf="!reclamation" class="loading-message">
  <p>Chargement des informations de la réclamation...</p>
</div>
