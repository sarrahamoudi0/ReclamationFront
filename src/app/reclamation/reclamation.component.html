<div class="form-wrapper">
    <div class="image-container">
      <img src="assets/img/reclamation.png" alt="rec" class="form-image">
    </div>
    
    <form (ngSubmit)="submitReclamation()" #reclamationForm="ngForm" enctype="multipart/form-data" class="reclamation-form">
      <div class="form-group">
        <label for="nom">
          <i class="fa fa-user"></i> Nom :
        </label>
        <input type="text" id="nom" name="nom" [(ngModel)]="newReclamation.nom" required class="form-control">
      </div>
  
      <div class="form-group">
        <label for="prenom">
          <i class="fa fa-user-circle"></i> Prénom :
        </label>
        <input type="text" id="prenom" name="prenom" [(ngModel)]="newReclamation.prenom" required class="form-control">
      </div>
  
      <div class="form-group">
        <label for="email">
          <i class="fa fa-envelope"></i> Email :
        </label>
        <input type="email" id="email" name="email" [(ngModel)]="newReclamation.email" required class="form-control">
      </div>
  
      <div class="form-group">
        <label for="num">
          <i class="fa fa-phone"></i> Numéro :
        </label>
        <input type="text" id="num" name="num" [(ngModel)]="newReclamation.num" required class="form-control">
      </div>
  
      <div class="form-group">
        <label for="titre">
          <i class="fa fa-pencil-alt"></i> Titre :
        </label>
        <input type="text" id="titre" name="titre" [(ngModel)]="newReclamation.titre" required class="form-control">
      </div>
  
      <div class="form-group">
        <label for="description">
          <i class="fa fa-pencil-alt"></i> Description :
        </label>
        <textarea id="description" name="description" [(ngModel)]="newReclamation.description" required class="form-control"></textarea>
      </div>
  
      <div class="form-group">
        <label for="image_reclamation">
          <i class="fa fa-image"></i> Image :
        </label>
        <input type="file" id="image_reclamation" (change)="onFileSelected($event)" accept="image/*" class="form-control-file">
      </div>
      
      <button type="submit" class="btn-submit">Envoyer la réclamation</button>
    </form>
  </div>
