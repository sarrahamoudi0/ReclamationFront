


<div class="reclamation-card">
  <form (ngSubmit)="submitReclamation()" #reclamationForm="ngForm" enctype="multipart/form-data" novalidate>

    <!-- TITRE -->
    <div class="form-group floating-label-group">
      <input type="text" id="titre" name="titre" [(ngModel)]="newReclamation.titre" required minlength="5" class="form-control" #titre="ngModel" placeholder=" " />
      <label for="titre">Titre <span class="required">*</span></label>
      <div class="error-message" *ngIf="titre.invalid && titre.touched">
        Le titre est requis (min 5 caractères).
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="form-group floating-label-group">
      <textarea id="description" name="description" [(ngModel)]="newReclamation.description" required minlength="10" class="form-control" #description="ngModel" placeholder=" "></textarea>
      <label for="description">Description <span class="required">*</span></label>
      <div class="error-message" *ngIf="description.invalid && description.touched">
        La description est requise (min 10 caractères).
      </div>
    </div>

    <!-- CATEGORY SELECTION -->
    <div class="form-group floating-label-group">
      <select id="categorie" name="categorie" [(ngModel)]="selectedCategory" class="form-control" (change)="onCategoryChange(selectedCategory)" required>
        <option value="" disabled selected hidden></option>
        <option *ngFor="let categorie of categories" [ngValue]="categorie">{{categorie.nomCategorie}}</option>
      </select>
      <label for="categorie">Catégorie <span class="required">*</span></label>
      <div class="error-message" *ngIf="!selectedCategory">
        La catégorie est requise.
      </div>
    </div>

    <!-- SUBCATEGORY SELECTION -->
    <div *ngIf="selectedCategory && selectedCategory.sousCategories && selectedCategory.sousCategories.length > 0" class="form-group floating-label-group">
      <select id="sous-categorie" name="sous-categorie" [(ngModel)]="selectedSubCategory" class="form-control" (change)="onSubCategoryChange(selectedSubCategory)" required>
        <option value="" disabled selected hidden></option>
        <option *ngFor="let sousCategorie of selectedCategory.sousCategories" [ngValue]="sousCategorie">{{sousCategorie.nomSousCategorie}}</option>
      </select>
      <label for="sous-categorie">Sous-Catégorie <span class="required">*</span></label>
    </div>

    <!-- IMAGE -->
    <div class="form-group file-group">
      <label for="image_reclamation" class="file-label">
        <i class="fa fa-image"></i> Ajouter une image (optionnel)
      </label>
      <input type="file" id="image_reclamation" (change)="onFileSelected($event)" accept="image/*" class="file-input">
    </div>

    <!-- SUBMIT BUTTON -->
    <button type="submit" [disabled]="reclamationForm.invalid" class="btn-submit">
      <i class="fa fa-paper-plane"></i> Envoyer la réclamation
    </button>
  </form>
</div>
