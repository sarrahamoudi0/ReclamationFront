<div class="app-layout">
  <!-- Sidebar admin/agent -->
  <app-sideabr-admin 
      *ngIf="isLoggedIn && isAgentOrAdmin" 
      [collapsed]="sidebarCollapsed"
      (toggle)="toggleSidebar()">
  </app-sideabr-admin>

  <div class="main-content"
       [class.with-sidebar]="isLoggedIn && isAgentOrAdmin"
       [class.collapsed]="sidebarCollapsed"
       [class.with-navbar]="isLoggedIn"
       [class.with-user-navbar]="isLoggedIn && isUser">
    <!-- Navbar system aligned with sidebar -->
    <app-navbar-system *ngIf="isLoggedIn"
                       [class.with-sidebar]="isLoggedIn && isAgentOrAdmin"
                       [class.collapsed]="sidebarCollapsed"></app-navbar-system>
    
    <!-- Navbar user -->
    <app-navbar *ngIf="isLoggedIn && isUser"></app-navbar>
    
    <!-- Chatbot -->
    <app-chatbot></app-chatbot>

    <!-- Page content -->
    <div class="page-wrapper">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
