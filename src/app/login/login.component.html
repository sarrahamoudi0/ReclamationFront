<!-- Login form -->
<form (ngSubmit)="onLogin()" id="Login">
  <!-- Left section of the form -->
 

  <!-- Right section of the form -->
  <div class="right">
    <div>
      <!-- Login heading -->
       <br>
       <br>
      <h1>Connexion</h1>
      <br>
    <br>

      <!-- Email input field -->
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        class="form-control"
        [ngClass]="{'input-error': emailInvalid}"
      />

      <!-- Password input field -->
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        class="form-control"
        [ngClass]="{'input-error': passwordInvalid}"
      />

      <!-- Error message for email or password -->
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <!-- Forgot password link -->
      <br>
      <a routerLink="/forgotpass" class="forgot-password-text">Mot de passe oublié?</a>

      <!-- Login button -->
      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
        Se connecter
      </button>
    </div>
  </div>
  <div class="left">
    <div>
      <!-- Welcome message and registration link -->
      <p>Bonjour, Bienvenue!</p>
      <a>Vous n'avez pas un compte?</a>
      <input routerLink="/register" type="submit" value="S'inscrire" />
    </div>
  </div>
</form>
