<div class="reclamations-container">

  <!-- Message si aucun résultat -->
  <div *ngIf="reclamations.length === 0" class="loading-message">
    <p>No reclamations found or loading...</p>
  </div>

  <!-- Vertical Card List -->
  <div *ngIf="reclamations.length > 0" class="vertical-list">
    <div *ngFor="let reclamation of reclamations" class="vertical-card">
      <div class="vertical-status-bar" [ngClass]="getStatutClass(reclamation.statut)"></div>
      <div class="vertical-card-content">
        <div class="vertical-card-header">
          <span class="vertical-title">{{ reclamation.titre | slice:0:50 }}</span>
          <span class="vertical-status-label" [ngClass]="getStatutClass(reclamation.statut)">
            {{ getDisplayStatut(reclamation.statut) }}
          </span>
        </div>
        <div class="vertical-desc">{{ reclamation.description | slice:0:150 }}</div>
        <div class="vertical-card-footer">
          <span class="vertical-date">🕒 {{ getFormattedDate(reclamation.createdDate) }}</span>
          <button class="arrow-btn" [routerLink]="['/reclamation', reclamation.idReclamation]">
            <i class="fa fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
