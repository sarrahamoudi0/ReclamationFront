<div class="profileupdate-card">
  <h2 class="profileupdate-title">Mettre à jour le profil</h2>
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <div class="profileupdate-row">
      <div class="profileupdate-group">
        <label>Prénom</label>
        <input formControlName="firstname" type="text" />
        <div class="profileupdate-error" *ngIf="profileForm.get('firstname')?.touched && profileForm.get('firstname')?.invalid">
          <span *ngIf="profileForm.get('firstname')?.errors?.['required']">Le prénom est requis.</span>
        </div>
      </div>
      <div class="profileupdate-group">
        <label>Nom</label>
        <input formControlName="lastname" type="text" />
        <div class="profileupdate-error" *ngIf="profileForm.get('lastname')?.touched && profileForm.get('lastname')?.invalid">
          <span *ngIf="profileForm.get('lastname')?.errors?.['required']">Le nom est requis.</span>
        </div>
      </div>
    </div>
    <div class="profileupdate-row">
      <div class="profileupdate-group">
        <label>Téléphone</label>
        <input formControlName="phone" type="text" />
      </div>
      <div class="profileupdate-group">
        <label>Email</label>
        <input formControlName="email" type="email" />
        <div class="profileupdate-error" *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.invalid">
          <span *ngIf="profileForm.get('email')?.errors?.['required']">L'email est requis.</span>
          <span *ngIf="profileForm.get('email')?.errors?.['email']">Format d'email invalide.</span>
        </div>
      </div>
    </div>
    <div class="profileupdate-row">
      <div class="profileupdate-group" style="flex:1;">
        <label>Mot de passe actuel</label>
        <input formControlName="currentPassword" type="password" />
        <div class="profileupdate-error" *ngIf="profileForm.get('currentPassword')?.touched && profileForm.get('currentPassword')?.invalid">
          <span *ngIf="profileForm.get('currentPassword')?.errors?.['required']">Le mot de passe est requis.</span>
        </div>
      </div>
    </div>
    <div *ngIf="errorMessage" class="profileupdate-error-message">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="profileupdate-success-message">{{ successMessage }}</div>
    <button class="profileupdate-btn" type="submit">Mettre à jour</button>
  </form>
</div>
  <!-- Modal activation code -->
<div *ngIf="showActivationModal" class="modal-backdrop">
    <div class="modal-content">
      <h3>Confirmez votre nouvel email</h3>
      <form [formGroup]="activationForm" (ngSubmit)="confirmEmailChange()">
        <label for="activationCode">Code de confirmation</label>
        <input formControlName="activationCode" id="activationCode" type="text" />
        <div *ngIf="activationForm.get('activationCode')?.invalid && activationForm.get('activationCode')?.touched" class="error">
          Le code est requis.
        </div>
        <button type="submit" [disabled]="activationForm.invalid">Confirmer</button>
        <button type="button" (click)="cancelActivation()">Annuler</button>
      </form>
    </div>
  </div>
