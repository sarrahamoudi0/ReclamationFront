<!-- Activation Form Layout -->
<form (ngSubmit)="onActivate()" id="ActivationForm">
  <!-- Left section -->
   <div class="left">
      <div>
        <p>Activation de votre compte</p>
        <a>Vous avez déjà un compte ?</a>
        <input routerLink="/login" type="submit" value="Se connecter" />
      </div>
    </div>

  <!-- Right section (Activation) -->
  <div class="right"> 
      <h1 style="display: inline;">Activation de votre compte</h1>

      
      <div class="activation-form">
        <br>
         <br>
          <br>
           <br>
            <br>
             <br>
        <input
          type="text"
          [(ngModel)]="activationCode"
          name="activationCode"
          (input)="onCodeInput()"
          placeholder="Entrez le code d'activation"
          maxlength="6"
          [ngClass]="{ 'invalid-input': isInvalid }"
          class="form-control"
        />
  <br>
  <br>
        <button 
          type="submit"
          class="btn-activate"
          [disabled]="isLoading || activationCode.length !== 6"
        >
          {{ isLoading ? 'Activation en cours...' : 'Activer le compte' }}
        </button>

        <div *ngIf="message" class="message" [ngClass]="{ 'success': isSuccess, 'error': isInvalid }">
          {{ message }}
        </div>
      </div>

      
    </div>
  
</form>
