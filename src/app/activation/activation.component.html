<div class="activation-container">
    <h2>Activation de votre compte</h2>
    <p class="instructions">Veuillez entrer le code d'activation envoyé à votre adresse e-mail.</p>
  
    <div class="activation-form">
      <input
        type="text"
        [(ngModel)]="activationCode"
        (input)="onCodeInput()"
        placeholder="Entrez votre code d'activation"
        maxlength="6"
        [ngClass]="{'invalid-input': isInvalid}"
      />
      <button 
        class="btn-activate"
        [disabled]="isLoading || activationCode.length !== 6"
        (click)="onActivate()">
        {{ isLoading ? 'Activation en cours...' : 'Activer le compte' }}
      </button>
  
      <div *ngIf="message" class="message" [ngClass]="{'success': isSuccess, 'error': isInvalid}">
        {{ message }}
      </div>
    </div>
  
    <div class="back-to-login">
      <p><a routerLink="/register">Retour à la page d'inscription</a></p>
    </div>
  </div>
