<nav class="navbar">
  <div class="navbar-content">

    <!-- Notifications -->
    <div class="navbar-section notification-section">
      <button class="icon-btn" tabindex="0" aria-label="Notifications">
        <span class="notification-icon">
          <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span *ngIf="notifications.length" class="badge animate">{{ notifications.length }}</span>
        </span>
      </button>

      <!-- Notifications Dropdown -->
      <div class="notification-wrapper">
        <div class="dropdown">
          <div *ngFor="let notif of notifications" class="dropdown-item" (click)="goToReclamation(notif.reclamationId)">
            {{ notif.message }}
          </div>
          <div *ngIf="!notifications.length" class="dropdown-item muted">Aucune notification</div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Profile -->
 

      <div class="dropdown profile-menu">
        <a class="dropdown-item" routerLink="/profile">Profil</a>
        <a class="dropdown-item" routerLink="/settings">Paramètres</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item logout" >Déconnexion</a>
      </div>
    </div>

  
</nav>
