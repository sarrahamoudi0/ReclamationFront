name: CI/CD Pipeline

on:
  push:
    branches:
      - backReclamation

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend JAR
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest

  deploy:
    needs: build-and-push-backend
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Print working directory and list files
        run: |
          Get-Location
          Get-ChildItem -Recurse

      - name: Pull latest backend image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest

      - name: Stop and remove existing backend container
        run: |
          $container = docker ps -a --filter name=reclamation-backend -q
          if ($container) {
            try { docker stop reclamation-backend } catch { Write-Host "ignore error" }
            try { docker rm reclamation-backend } catch { Write-Host "ignore error" }
          } else {
            Write-Host "Container reclamation-backend does not exist, skipping stop/remove"
          }

      - name: Start new backend container with latest image
        run: |
          docker run -d --name reclamation-backend -p 8083:8083 --restart always -e SPRING_APPLICATION_NAME=Reclamation -e SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/reclamation -e SPRING_DATA_MONGODB_DATABASE=Reclamation -e SERVER_PORT=8083 -e SPRING_SERVLET_MULTIPART_ENABLED=true -e SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=10MB -e SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=10MB -e APPLICATION_SECURITY_JWT_SECRET_KEY=SR72aaIRCzXl7ohXLVsM_vegwD7h-6DT1jerbJwTtI4= -e APPLICATION_SECURITY_JWT_EXPIRATION=86400000 -e LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG -e SPRING_MAIL_HOST=smtp.zoho.com -e SPRING_MAIL_PORT=587 -e SPRING_MAIL_USERNAME=noreply@maginater.com -e SPRING_MAIL_PASSWORD=Test1234,azert -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=false -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true -e LOGGING_LEVEL_JAKARTA_MAIL=DEBUG -e SPRING_PROFILES_ACTIVE=dev -e APPLICATION_MAILING_FRONTEND_ACTIVATION_URL=http://localhost:4200/activate-account -e APPLICATION_MAILING_FRONTEND_CHANGE_EMAIL_URL=http://localhost:4200/profile -e RESET_PASSWORD_URL=http://localhost:4200/reset-password -e LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB_CORE_MONGOTEMPLATE=DEBUG ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest