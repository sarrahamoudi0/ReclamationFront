name: CI/CD Pipeline

on:
  push:
    branches:
      - backReclamation

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend JAR
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest

  deploy:
    needs: build-and-push-backend
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Print working directory and list files
        run: |
          Get-Location
          Get-ChildItem -Recurse

      - name: Pull latest backend image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest

      - name: Stop and remove existing backend container
        run: |
          $container = docker ps -a --filter name=reclamation-backend --format '{{.Names}}''
          if ($container) {
            try { docker stop reclamation-backend } catch { Write-Host 'ignore error' }
            try { docker rm reclamation-backend } catch { Write-Host 'ignore error' }
          } else {
            Write-Host "Container reclamation-backend does not exist, skipping stop/remove"
          }

      - name: Start new backend container with latest image
        run: docker-compose -f docker-compose.yml up -d --force-recreate --remove-orphans backend