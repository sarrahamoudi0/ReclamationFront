name: CI/CD Pipeline

on:
  push:
    branches:
      - backReclamation

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend JAR
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest

  deploy:
    needs: build-and-push-backend
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Print working directory and list files
        run: |
          Get-Location
          Get-ChildItem

      - name: Pull latest backend image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-backend:latest

      - name: Stop and remove existing containers
        run: |
          try { docker-compose -f ReclamationBack/docker-compose.yml down } catch { Write-Host 'ignore error' }

      - name: Start new containers with latest images
        run: docker-compose -f ReclamationBack/docker-compose.yml up -d --force-recreate --remove-orphans