name: Build and Push Docker Image

on:
  push:
    branches:
      - frontReclamation

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/reclamation-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print working directory and list files
        run: |
          Get-Location
          Get-ChildItem -Recurse

      - name: Pull latest frontend image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/reclamation:latest

      - name: Stop and remove existing frontend container
        run: |
          $container = docker ps -a --filter name=reclamation-frontend -q
          if ($container) {
            try { docker stop reclamation-frontend } catch { Write-Host "ignore error" }
            try { docker rm reclamation-frontend } catch { Write-Host "ignore error" }
          } else {
            Write-Host "Container reclamation-frontend does not exist, skipping stop/remove"
          }

      - name: Start new frontend container with latest image
        run: docker-compose -f docker-compose.yml up -d --force-recreate --remove-orphans frontend